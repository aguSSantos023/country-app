@if (country()) {
<section class="mx-10">
  <div>
    <h1 class="text-3xl">{{ country().name }}</h1>
    <h2 class="text-xl font-thin">{{ country().capital }}</h2>

    <div class="stats shadow">
      <div class="stat">
        <div class="stat-figure text-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            class="inline-block h-8 w-8 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div class="stat-title">Poblacion</div>
        <div class="stat-value">{{ country().population | number }}</div>
      </div>
    </div>

  </div>



</section>

  <section class="diff aspect-16/9" tabindex="0">
    <div class="diff-item-1" role="img" tabindex="0">
      <img [alt]="country().name " [src]="country().flagSvg" />
    </div>
    <div class="diff-item-2 blur brightness-75" role="img">
      <img [alt]="country().name" [src]="country().flagSvg" />
    </div>
    <div class="diff-resizer"></div>
  </section>
}
