
<app-country-search-input-c
  placeholder="Buscar por capital de mi país"
  (valueSearch)="onSearch($event)"
/>


@if(isError()) {
  <h3>{{ isError() }}</h3>
}@else {
  <app-country-list-c
    [countries]="countries()"
    [errorMessage]="isError()"
    [isEmpty]="countries().length < 0"
    [isLoading]="isLoading()"
  />
}
